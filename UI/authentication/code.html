<script>
        // Simple micro-interaction for password visibility toggle
        const togglePassword = document.querySelector('.material-symbols-outlined:contains("visibility")');
        const passwordInput = document.getElementById('password');

        if(togglePassword && passwordInput) {
            togglePassword.addEventListener('click', function (e) {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                this.textContent = type === 'password' ? 'visibility' : 'visibility_off';
            });
        }
        
        // jQuery style selector polyfill for the simple script above
        HTMLElement.prototype.contains = function(text) {
             return this.innerText.indexOf(text) > -1;
        };
    </script>

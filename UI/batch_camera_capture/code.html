<style>
        .viewfinder-corner {
            width: 40px;
            height: 40px;
            border-color: theme('colors.secondary');
            border-style: solid;
        }
        .corner-tl { border-width: 3px 0 0 3px; top: 20%; left: 10%; }
        .corner-tr { border-width: 3px 3px 0 0; top: 20%; right: 10%; }
        .corner-bl { border-width: 0 0 3px 3px; bottom: 20%; left: 10%; }
        .corner-br { border-width: 0 3px 3px 0; bottom: 20%; right: 10%; }
        
        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100vh); }
        }
        .scan-effect {
            animation: scanline 4s linear infinite;
            background: linear-gradient(to bottom, transparent, rgba(79, 219, 200, 0.2), transparent);
        }
        
        .capture-glow {
            box-shadow: 0 0 20px rgba(128, 131, 255, 0.4);
        }
        
        /* Hide scrollbar for thumbnails */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>
</head>
<body class="bg-background text-on-background h-screen w-screen overflow-hidden font-body-md select-none">
<!-- Camera Background Container (Simulated Viewfinder) -->
<div class="absolute inset-0 z-0 bg-surface-container-lowest">
<!-- In a real app, the camera feed would be here -->
<div class="absolute inset-0 bg-cover bg-center opacity-40" data-alt="A simulated high-tech camera feed viewing an open physics textbook. The lighting is dim with a slightly blueish, clinical hue. The textbook pages contain complex equations and diagrams. The overall scene looks like it's being viewed through a futuristic scanning device, emphasizing precision and data collection in a dark, focused study environment." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBRpssuyTxXJD1m4eGpWxijx5qhabsuwaxXEuXbR8tfjkgWmlCCl-YMZXkfo4MZ-4oTKMfrxPEHKAc3nxh8WYA1YeJL8O0x-UmVYzrmghBq50QgSaXS069LnYHXGpEtpZ5gdYJepEshG-tzBGdqtzgKdnFFn0GPSx9mCmaP5RlPzFLpUSjm62jP4-Os_8h_7IzPMUYAQFKJwg3US5Y45p6wc8wPzKN65tS-KQKVnYFkhlDL-lUyvWP2-g')"></div>

<div class="absolute inset-0 h-[20px] w-full scan-effect z-10 pointer-events-none"></div>
</div>
<!-- UI Overlay Layer -->
<div class="relative z-20 h-full flex flex-col justify-between">
<!-- Top Controls Bar -->
<div class="flex justify-between items-center px-margin-mobile py-lg bg-gradient-to-b from-background/80 to-transparent backdrop-blur-sm">
<button class="p-2 rounded-full bg-surface-variant/50 text-on-surface-variant hover:text-primary transition-colors border border-white/10 backdrop-blur-md">
<span class="material-symbols-outlined text-[24px]">close</span>
</button>
<!-- Batch Mode Toggle Indicator -->
<div class="flex items-center gap-2 bg-primary-container/20 border border-primary/30 rounded-full px-4 py-2 backdrop-blur-md shadow-[0_0_12px_rgba(192,193,255,0.2)]">
<span class="material-symbols-outlined text-primary text-[18px]" data-weight="fill">burst_mode</span>
<span class="font-label-md text-label-md text-primary tracking-wide">BATCH MODE ON</span>
</div>
<button class="p-2 rounded-full bg-surface-variant/50 text-on-surface-variant hover:text-primary transition-colors border border-white/10 backdrop-blur-md">
<span class="material-symbols-outlined text-[24px]">flash_on</span>
</button>
</div>
<!-- Viewfinder Reticle Overlay -->
<div class="absolute inset-0 pointer-events-none flex items-center justify-center">
<div class="relative w-full h-full max-w-lg max-h-[60vh] border border-white/10 mx-margin-mobile rounded-lg">
<div class="absolute viewfinder-corner corner-tl"></div>
<div class="absolute viewfinder-corner corner-tr"></div>
<div class="absolute viewfinder-corner corner-bl"></div>
<div class="absolute viewfinder-corner corner-br"></div>
<!-- Center Crosshair -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-8 h-8 opacity-50">
<div class="absolute top-1/2 left-0 right-0 h-px bg-secondary"></div>
<div class="absolute left-1/2 top-0 bottom-0 w-px bg-secondary"></div>
</div>
</div>
</div>
<!-- OCR Status Indicator (Floating) -->
<div class="absolute top-[20%] left-1/2 -translate-x-1/2 bg-surface-container-high/90 border border-outline-variant rounded-full px-md py-sm flex items-center gap-sm backdrop-blur-xl shadow-lg z-30">
<span class="material-symbols-outlined text-secondary animate-pulse text-[16px]">memory</span>
<span class="font-label-md text-label-md text-on-surface">Processing question 3...</span>
</div>

<div class="bg-surface-container/80 backdrop-blur-xl border-t border-white/10 pt-md pb-safe-offset shadow-[0_-10px_40px_rgba(0,0,0,0.5)]">

<div class="w-full h-full bg-cover bg-center" data-alt="Another small thumbnail showing a different section of a textbook page, focused on complex mathematical equations. The image is slightly tilted, indicating a casual scan. The lighting is functional, with a slight vignette effect common in document scanning apps." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBAG8wfMqYi7cIhLodHBGrTK9rN1wCSKHxM_u77ezArKugm_vCHZbc7Tai2RNNB2LQ3gvAIMQvkV6QrmKbL-xqF1lViyg_m5OUG7iRYq4dzRGvoTbPUn7Oewa2phzpL3rWvX08zEgziEv_Gk2z-ZBnzf8imf_jqwKqCv4N_eghvWgpGy3hcwPErfRVSSeOmoW0bi7Q2g2oFhmh8Ze256CCJIlMbgSERyLf6gnkgWdc3REIRqg5oy8l2LA')"></div>

<button class="relative w-[72px] h-[72px] rounded-full bg-gradient-to-br from-surface to-surface-container-high border-2 border-primary flex items-center justify-center capture-glow hover:scale-95 transition-transform duration-200 z-10 group">

</div>
</button>
